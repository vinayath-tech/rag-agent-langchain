description: Test agent evaluator

prompts:
  - ../prompts/test-prompt.yaml

# providers:
#   - openai:gpt-5.2
providers:  
   - id: https 
     config: 
      url: http://localhost:3001/jira-test-case-agent
      method: POST
      headers:
        Content-Type: application/json
      body:
        query: "{{issueKey}}"
      responseParser: json.result

defaultTest:
  assert:
    - type: latency
      threshold: 30000

allowErrors: true

tests:
  - file://datasets/functional.yaml
  - file://datasets/security.yaml
  - file://datasets/edgecase.yaml